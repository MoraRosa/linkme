<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hikmah Adepoju · Peak Enterprise</title>
  <meta name="description" content="Hikmah Adepoju, Founder of Peak Enterprise. Save my contact details or tap a link.">
  <meta name="theme-color" content="#f8f1e9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#211d25" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Hikmah Adepoju · Peak Enterprise">
  <meta property="og:description" content="Run your business. Stop running spreadsheets.">
  <meta property="og:url" content="https://morarosa.github.io/linkme/">
  <meta property="og:image" content="https://morarosa.github.io/linkme/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Pippa, the Peak Enterprise mascot, piloting a grey clay airplane">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Hikmah Adepoju · Peak Enterprise">
  <meta name="twitter:description" content="Run your business. Stop running spreadsheets.">
  <meta name="twitter:image" content="https://morarosa.github.io/linkme/og-image.jpg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LinkMe">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#links">Skip to links</a>

  <main class="card" id="card" aria-busy="true" data-details="show">
    <header class="head">
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <h1 id="name">Hikmah Adepoju</h1>
      <p class="role" id="role"></p>
      <p class="tagline" id="tagline"></p>
    </header>

    <div class="actions">
      <a class="btn btn--pink" id="save" href="contact.vcf" download="contact.vcf">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Save contact
      </a>
      <button class="btn btn--sage" id="show-qr" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h3v3h-3zM20 14v6h-6"/></svg>
        Show QR
      </button>
    </div>

    <div class="detail-toggle">
      <button class="clay-toggle" id="details-switch" type="button" role="switch" aria-checked="true" aria-labelledby="details-label">
        <span class="clay-toggle-track" aria-hidden="true"><span class="clay-toggle-thumb"></span></span>
        <span class="clay-toggle-label" id="details-label">Show details</span>
        <span class="clay-toggle-status" id="details-status" aria-hidden="true">On</span>
      </button>
    </div>

    <ul class="links" id="links"></ul>

    <p class="place" id="place"></p>
  </main>

  <dialog id="qr-dialog" aria-labelledby="qr-title">
    <div class="qr-panel">
      <h2 id="qr-title">Scan to get my card</h2>
      <div class="qr-box" id="qr-box" role="img" aria-label="QR code that opens this card"></div>
      <p class="qr-url" id="qr-url"></p>
      <button class="btn btn--sage" id="qr-share" type="button">Share link</button>
      <button class="btn btn--quiet" id="qr-close" type="button">Close</button>
    </div>
  </dialog>

  <script src="vendor/qrcode.js"></script>
  <script src="app.js"></script>
</body>
</html>
